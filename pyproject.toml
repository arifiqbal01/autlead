[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autlead"
version = "0.1.0"
description = "ETL-driven B2B lead intelligence and generation platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16",
    "asyncpg>=0.30",
    "celery>=5.5",
    "crawl4ai>=0.9.2",
    "email-validator>=2.3.0",
    "gmaps-extractor>=2.0.0",
    "google-genai>=2.20.0",
    "groq>=1.7.0",
    "httpx>=0.28",
    "phonenumbers>=9.0.37",
    "playwright>=1.52",
    "psycopg[binary]>=3.2",
    "pydantic>=2.11",
    "pydantic-settings>=2.9",
    "redis>=6.0",
    "sqlalchemy>=2.0",
    "structlog>=25.4",
    "tenacity>=9.1",
    "wappalyzer>=1.0.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [
    ".",
]
testpaths = [
    "tests",
]
markers = [
    "integration: tests that use real external services or infrastructure",
]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.hatch.build.targets.wheel]
packages = ["app"]
